name: Build PHP Dependency RPMs (libsodium, libargon2)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - libsodium
          - libargon2
          - libzip
      el_versions:
        description: 'EL versions to build'
        required: true
        default: 'el10'
        type: choice
        options:
          - el10
          - el9
          - el8
          - el9-el10
          - el8-el9-el10
  push:
    paths:
      - 'tools/php-package-builder.sh'
      - '.github/workflows/php-dependency-rpms.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.el_versions || 'auto' }}
  cancel-in-progress: true

jobs:
  build-rpms:
    name: Build RPMs for EL${{ matrix.el_version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        el_version: ${{ fromJSON(
          github.event.inputs.el_versions == 'el10' && '[10]' ||
          github.event.inputs.el_versions == 'el9' && '[9]' ||
          github.event.inputs.el_versions == 'el8' && '[8]' ||
          github.event.inputs.el_versions == 'el9-el10' && '[9, 10]' ||
          github.event.inputs.el_versions == 'el8-el9-el10' && '[8, 9, 10]' ||
          '[10]'
        ) }}

    steps:
      - name: Checkout centminmod-claudecode repository
        uses: actions/checkout@v4
        with:
          repository: centminmod/centminmod
          ref: 141.00beta01
          path: centminmod

      - name: Install Sysbox
        run: |
          curl -LO https://downloads.nestybox.com/sysbox/releases/v0.7.1/sysbox-ce_0.7.1-0.linux_amd64.deb
          sudo dpkg -i sysbox-ce_0.7.1-0.linux_amd64.deb || sudo apt-get install -f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Dockerfile
        id: dockerfile
        run: |
          if [[ "${{ matrix.el_version }}" == "10" ]]; then
            echo "dockerfile=./dockerfiles/Dockerfile-almalinux10" >> $GITHUB_OUTPUT
            echo "tag=cmm_el10:latest" >> $GITHUB_OUTPUT
            echo "container_name=cmm_el10" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.el_version }}" == "9" ]]; then
            echo "dockerfile=./dockerfiles/Dockerfile-almalinux9" >> $GITHUB_OUTPUT
            echo "tag=cmm_el9:latest" >> $GITHUB_OUTPUT
            echo "container_name=cmm_el9" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.el_version }}" == "8" ]]; then
            echo "dockerfile=./dockerfiles/Dockerfile-almalinux8" >> $GITHUB_OUTPUT
            echo "tag=cmm_el8:latest" >> $GITHUB_OUTPUT
            echo "container_name=cmm_el8" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.dockerfile.outputs.tag }}

      - name: Run Container
        run: |
          docker run --cgroupns host -d \
            --name=${{ steps.dockerfile.outputs.container_name }} \
            --privileged \
            --runtime=sysbox-runc \
            --cap-add=SYS_ADMIN \
            --cap-add=SYS_RESOURCE \
            --security-opt seccomp=unconfined \
            --security-opt label=disable \
            --security-opt apparmor=unconfined \
            --tmpfs /run \
            --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            -v $(pwd)/centminmod:/centminmod \
            ${{ steps.dockerfile.outputs.tag }}
          sleep 4

      - name: Install Build Dependencies in Container
        run: |
          echo "Installing Development Tools group and build dependencies..."
          docker exec ${{ steps.dockerfile.outputs.container_name }} bash -c "
            # Install Development Tools group (matches installer-el10.sh:2789)
            echo '=== Installing Development Tools group ==='
            dnf -y groupinstall 'Development Tools'

            # Install additional library dependencies
            echo '=== Installing additional libraries ==='
            dnf -y install zlib-devel bzip2-devel openssl-devel systemd-devel wget tar gzip xz xz-devel zstd-devel cmake3 --skip-broken

            # Install RPM building tools
            echo '=== Installing RPM build tools ==='
            dnf -y install rpm-build ruby-devel rubygems

            # Install FPM
            echo '=== Installing FPM gem ==='
            gem install --no-document fpm

            # Update dynamic linker cache (CRITICAL for shared libraries)
            echo '=== Updating dynamic linker cache ==='
            ldconfig

            # Verification
            echo '=== Verification ==='
            gcc --version
            g++ --version
            make --version
            pkg-config --version
            fpm --version
            echo 'Build environment ready!'
          "

      - name: Build RPMs in Container
        run: |
          echo "Building RPMs for EL${{ matrix.el_version }}..."
          docker exec ${{ steps.dockerfile.outputs.container_name }} bash -c "
            cd /centminmod
            ./tools/php-package-builder.sh --${{ github.event.inputs.build_target || 'all' }} --el${{ matrix.el_version }}
          "

      - name: Copy RPMs from Container
        run: |
          mkdir -p ./rpms/el${{ matrix.el_version }}
          docker cp ${{ steps.dockerfile.outputs.container_name }}:/centminmod/rpmbuild/RPMS/x86_64/. ./rpms/el${{ matrix.el_version }}/
          ls -lh ./rpms/el${{ matrix.el_version }}/

      - name: Display RPM Information
        run: |
          echo "=== RPM Package Information ==="
          for rpm in ./rpms/el${{ matrix.el_version }}/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "----------------------------------------"
              echo "Package: $(basename $rpm)"
              rpm -qip "$rpm"
              echo ""
              echo "File list:"
              rpm -qlp "$rpm"
              echo "----------------------------------------"
            fi
          done

      - name: Upload RPMs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-dependency-rpms-el${{ matrix.el_version }}
          path: ./rpms/el${{ matrix.el_version }}/*.rpm
          retention-days: 90

  upload-to-r2:
    name: Upload RPMs to Cloudflare R2
    needs: build-rpms
    runs-on: ubuntu-24.04
    if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')

    steps:
      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-rpms

      - name: Organize RPMs by package
        run: |
          mkdir -p ./organized-rpms/libsodium
          mkdir -p ./organized-rpms/libargon2
          mkdir -p ./organized-rpms/libzip

          # Find and organize libsodium RPMs
          find ./all-rpms -name "libsodium-custom-*.rpm" -exec cp {} ./organized-rpms/libsodium/ \;

          # Find and organize libargon2 RPMs
          find ./all-rpms -name "libargon2-custom-*.rpm" -exec cp {} ./organized-rpms/libargon2/ \;

          # Find and organize libzip RPMs
          find ./all-rpms -name "libzip-custom-*.rpm" -exec cp {} ./organized-rpms/libzip/ \;

          echo "=== Organized RPMs ==="
          ls -lhR ./organized-rpms/

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone for Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = public-read
          no_check_bucket = true
          EOF

          echo "rclone configured successfully"

      - name: Upload libsodium RPMs to R2
        if: hashFiles('./organized-rpms/libsodium/*.rpm') != ''
        run: |
          echo "Uploading libsodium RPMs to R2..."
          rclone copy ./organized-rpms/libsodium/ \
            r2:cmm-parts-neus/centminmodparts/rpms/libsodium/ \
            --progress \
            --s3-acl=public-read \
            --s3-upload-cutoff=100M \
            --s3-chunk-size=100M

          echo "=== Verifying libsodium upload ==="
          rclone ls r2:cmm-parts-neus/centminmodparts/rpms/libsodium/

      - name: Upload libargon2 RPMs to R2
        if: hashFiles('./organized-rpms/libargon2/*.rpm') != ''
        run: |
          echo "Uploading libargon2 RPMs to R2..."
          rclone copy ./organized-rpms/libargon2/ \
            r2:cmm-parts-neus/centminmodparts/rpms/libargon2/ \
            --progress \
            --s3-acl=public-read \
            --s3-upload-cutoff=100M \
            --s3-chunk-size=100M

          echo "=== Verifying libargon2 upload ==="
          rclone ls r2:cmm-parts-neus/centminmodparts/rpms/libargon2/

      - name: Upload libzip RPMs to R2
        if: hashFiles('./organized-rpms/libzip/*.rpm') != ''
        run: |
          echo "Uploading libzip RPMs to R2..."
          rclone copy ./organized-rpms/libzip/ \
            r2:cmm-parts-neus/centminmodparts/rpms/libzip/ \
            --progress \
            --s3-acl=public-read \
            --s3-upload-cutoff=100M \
            --s3-chunk-size=100M

          echo "=== Verifying libzip upload ==="
          rclone ls r2:cmm-parts-neus/centminmodparts/rpms/libzip/

      - name: Generate Directory Index HTML
        run: |
          # Create index.html for libsodium
          cat > ./organized-rpms/libsodium/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Centmin Mod - libsodium RPMs</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  .file-list { margin-top: 20px; }
                  .file-list a { display: block; padding: 8px; color: #0066cc; text-decoration: none; }
                  .file-list a:hover { background-color: #f0f0f0; }
              </style>
          </head>
          <body>
              <h1>Centmin Mod - libsodium RPMs</h1>
              <p>Custom libsodium RPM packages for Centmin Mod LEMP stack</p>
              <div class="file-list">
          EOF

          for rpm in ./organized-rpms/libsodium/*.rpm; do
              if [[ -f "$rpm" ]]; then
                  filename=$(basename "$rpm")
                  echo "        <a href=\"$filename\">$filename</a>" >> ./organized-rpms/libsodium/index.html
              fi
          done

          cat >> ./organized-rpms/libsodium/index.html << 'EOF'
              </div>
              <hr>
              <p><a href="https://centminmod.com">Back to Centmin Mod</a></p>
          </body>
          </html>
          EOF

          # Create index.html for libargon2
          cat > ./organized-rpms/libargon2/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Centmin Mod - libargon2 RPMs</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  .file-list { margin-top: 20px; }
                  .file-list a { display: block; padding: 8px; color: #0066cc; text-decoration: none; }
                  .file-list a:hover { background-color: #f0f0f0; }
              </style>
          </head>
          <body>
              <h1>Centmin Mod - libargon2 RPMs</h1>
              <p>Custom libargon2 RPM packages for Centmin Mod LEMP stack</p>
              <div class="file-list">
          EOF

          for rpm in ./organized-rpms/libargon2/*.rpm; do
              if [[ -f "$rpm" ]]; then
                  filename=$(basename "$rpm")
                  echo "        <a href=\"$filename\">$filename</a>" >> ./organized-rpms/libargon2/index.html
              fi
          done

          cat >> ./organized-rpms/libargon2/index.html << 'EOF'
              </div>
              <hr>
              <p><a href="https://centminmod.com">Back to Centmin Mod</a></p>
          </body>
          </html>
          EOF

          # Create index.html for libzip
          cat > ./organized-rpms/libzip/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Centmin Mod - libzip RPMs</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  .file-list { margin-top: 20px; }
                  .file-list a { display: block; padding: 8px; color: #0066cc; text-decoration: none; }
                  .file-list a:hover { background-color: #f0f0f0; }
              </style>
          </head>
          <body>
              <h1>Centmin Mod - libzip RPMs</h1>
              <p>Custom libzip RPM packages for Centmin Mod LEMP stack (ImageMagick7 builds)</p>
              <div class="file-list">
          EOF

          for rpm in ./organized-rpms/libzip/*.rpm; do
              if [[ -f "$rpm" ]]; then
                  filename=$(basename "$rpm")
                  echo "        <a href=\"$filename\">$filename</a>" >> ./organized-rpms/libzip/index.html
              fi
          done

          cat >> ./organized-rpms/libzip/index.html << 'EOF'
              </div>
              <hr>
              <p><a href="https://centminmod.com">Back to Centmin Mod</a></p>
          </body>
          </html>
          EOF

      - name: Upload Index HTML to R2
        run: |
          echo "Uploading index.html files..."
          rclone copy ./organized-rpms/libsodium/index.html \
            r2:cmm-parts-neus/centminmodparts/rpms/libsodium/ \
            --s3-acl=public-read

          rclone copy ./organized-rpms/libargon2/index.html \
            r2:cmm-parts-neus/centminmodparts/rpms/libargon2/ \
            --s3-acl=public-read

          rclone copy ./organized-rpms/libzip/index.html \
            r2:cmm-parts-neus/centminmodparts/rpms/libzip/ \
            --s3-acl=public-read

      - name: Upload Summary
        run: |
          echo "=== Upload Complete ===" | tee upload-summary.txt
          echo "" | tee -a upload-summary.txt
          echo "libsodium RPMs uploaded to:" | tee -a upload-summary.txt
          echo "  https://parts.centminmod.com/centminmodparts/rpms/libsodium/" | tee -a upload-summary.txt
          echo "" | tee -a upload-summary.txt
          echo "libargon2 RPMs uploaded to:" | tee -a upload-summary.txt
          echo "  https://parts.centminmod.com/centminmodparts/rpms/libargon2/" | tee -a upload-summary.txt
          echo "" | tee -a upload-summary.txt
          echo "libzip RPMs uploaded to:" | tee -a upload-summary.txt
          echo "  https://parts.centminmod.com/centminmodparts/rpms/libzip/" | tee -a upload-summary.txt
          echo "" | tee -a upload-summary.txt
          echo "Files:" | tee -a upload-summary.txt
          ls -1 ./organized-rpms/libsodium/*.rpm 2>/dev/null | xargs -n1 basename | tee -a upload-summary.txt
          ls -1 ./organized-rpms/libargon2/*.rpm 2>/dev/null | xargs -n1 basename | tee -a upload-summary.txt
          ls -1 ./organized-rpms/libzip/*.rpm 2>/dev/null | xargs -n1 basename | tee -a upload-summary.txt

          cat upload-summary.txt >> $GITHUB_STEP_SUMMARY

  discordNotificationSuccess:
    needs: [build-rpms, upload-to-r2]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    steps:
    - name: Notify Discord Success
      run: |
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{\"content\":\"✅ PHP Dependency RPM build completed successfully!\n\n**Build Target:** ${{ github.event.inputs.build_target || 'all' }}\n**EL Versions:** ${{ github.event.inputs.el_versions || 'el10' }}\n**Workflow:** ${{ github.workflow }}\n**Triggered by:** ${{ github.event_name }}\"}" \
             ${{ secrets.DISCORD_WEBHOOK_URL }}

  discordNotificationFailure:
    needs: [build-rpms, upload-to-r2]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
    - name: Notify Discord Failure
      run: |
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{\"content\":\"❌ PHP Dependency RPM build failed!\n\n**Build Target:** ${{ github.event.inputs.build_target || 'all' }}\n**EL Versions:** ${{ github.event.inputs.el_versions || 'el10' }}\n**Workflow:** ${{ github.workflow }}\n**Triggered by:** ${{ github.event_name }}\"}" \
             ${{ secrets.DISCORD_WEBHOOK_URL }}
